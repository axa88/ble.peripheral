; Copy to platformio.local.ini and replace the placeholders.
[local]
wifi_ssid_flag = -DWIFI_SSID=\"<replace-with-wifi-ssid>\"
wifi_password_flag = -DWIFI_PASSWORD=\"<replace-with-wifi-password>\"
ota_password_wrover_flag = -DOTA_PASSWORD=\"<replace-with-ota-password>\"
ota_password_c3_flag = -DOTA_PASSWORD=\"<replace-with-ota-password>\"
web_auth_flags =
    -DWEB_USERNAME=\"ble\"
    -DWEB_PASSWORD=\"<replace-with-a-long-random-web-password>\"

ota_upload_wrover_flags = --auth=REPLACE_WITH_EXISTING_OTA_PASSWORD

ota_upload_c3_flags = --auth=REPLACE_WITH_EXISTING_OTA_PASSWORD
